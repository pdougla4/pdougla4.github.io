    :root {
      --fg: #0f172a;
      --muted: #475569;
      --bg: #f8fafc;
      --card: #ffffff;
      --btn: #0f172a;
      --border: #e2e8f0;
      --pill: #e2e8f0;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font:
        16px/1.5 system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Inter,
        Roboto,
        Arial,
        sans-serif;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(2, 6, 23, 0.08);
      padding: 28px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 30px;
      line-height: 1.2;
    }

    h2 {
      margin: 18px 0 10px;
      font-size: 19px;
      line-height: 1.3;
    }

    p {
      margin: 7px 0;
      color: var(--muted);
    }

    ul {
      margin: 12px 0 4px;
      padding-left: 22px;
    }

    li {
      margin: 8px 0;
      color: var(--muted);
    }

    strong {
      color: var(--fg);
    }

    a {
      color: inherit;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0 8px;
    }

    a.btn {
      display: inline-block;
      padding: 12px 16px;
      border-radius: 12px;
      text-decoration: none;
      background: var(--btn);
      color: #ffffff;
      font-weight: 600;
    }

    a.btn:hover,
    a.btn:focus-visible {
      opacity: 0.88;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    .pill {
      padding: 6px 11px;
      border-radius: 999px;
      background: var(--pill);
      color: var(--fg);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .pill:hover,
    .pill:focus-visible {
      background: #cbd5e1;
    }

      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
